<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | ADHERENCIA 360</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .login-wrap { width:100%; max-width:420px; padding:24px; }
    .login-logo { text-align:center; margin-bottom:32px; }
    .login-logo i { font-size:3rem; color:var(--primary); display:block; margin-bottom:10px; }
    .login-logo h1 { font-family:'Syne',sans-serif; font-size:1.8rem; font-weight:800; color:var(--text); }
    .login-logo h1 span { color:var(--green); }
    .login-logo p { font-size:.85rem; color:var(--text-sub); margin-top:4px; }

    .role-tabs { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
    .role-tab {
      padding:14px 10px; border-radius:12px; border:2px solid var(--border);
      background:var(--surface); cursor:pointer; text-align:center;
      transition:all .2s; display:flex; flex-direction:column; align-items:center; gap:8px;
    }
    .role-tab i { font-size:1.6rem; color:var(--text-sub); }
    .role-tab span { font-size:.85rem; font-weight:600; color:var(--text-sub); }
    .role-tab.active { border-color:var(--primary); background:rgba(37,99,235,.07); }
    .role-tab.active i, .role-tab.active span { color:var(--primary); }

    .login-card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:28px; box-shadow:var(--shadow-lg); }
    .login-card h2 { font-family:'Syne',sans-serif; font-size:1.1rem; font-weight:700; color:var(--text); margin-bottom:20px; display:flex; align-items:center; gap:8px; }
    .login-card h2 i { color:var(--primary); }

    .demo-hint { background:rgba(37,99,235,.08); border:1px solid rgba(37,99,235,.2); border-radius:10px; padding:12px 14px; margin-bottom:20px; font-size:.8rem; color:var(--text-sub); }
    .demo-hint strong { color:var(--primary); display:block; margin-bottom:4px; }
    .demo-hint code { background:rgba(37,99,235,.12); padding:1px 6px; border-radius:4px; font-family:monospace; color:var(--text); }

    .btn-login { width:100%; padding:13px; margin-top:4px; font-size:.95rem; }
    .login-footer { text-align:center; margin-top:20px; font-size:.82rem; color:var(--text-sub); }
    .login-footer a { color:var(--primary); text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <i class="fa-solid fa-shield-heart"></i>
      <h1>ADHERENCIA <span>360</span></h1>
      <p>Sistema de seguimiento terapéutico</p>
    </div>

    <!-- Selector de rol -->
    <div class="role-tabs">
      <div class="role-tab active" id="tabMedico" onclick="setRol('medico')">
        <i class="fa-solid fa-stethoscope"></i>
        <span>Médico / Admin</span>
      </div>
      <div class="role-tab" id="tabPaciente" onclick="setRol('paciente')">
        <i class="fa-solid fa-user-injured"></i>
        <span>Paciente</span>
      </div>
    </div>

    <div class="login-card">
      <h2 id="loginTitle"><i class="fa-solid fa-stethoscope"></i> Acceso Médico</h2>

      <div class="demo-hint" id="demoHint">
        <strong>Credenciales de demo:</strong>
        Usuario: <code>doctor</code> &nbsp; Contraseña: <code>1234</code>
      </div>

      <form id="formLogin" onsubmit="handleLogin(event)">
        <div class="form-group" style="margin-bottom:14px">
          <label>Usuario / DNI</label>
          <input type="text" id="loginUser" required placeholder="Ingresa tu usuario" autocomplete="username">
        </div>
        <div class="form-group" style="margin-bottom:20px; position:relative">
          <label>Contraseña</label>
          <input type="password" id="loginPass" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" onclick="togglePass()" style="position:absolute;right:12px;bottom:10px;background:none;border:none;cursor:pointer;color:var(--text-sub)">
            <i class="fa-solid fa-eye" id="eyeIcon"></i>
          </button>
        </div>
        <div id="loginError" style="display:none;color:var(--red);font-size:.82rem;margin-bottom:12px;padding:10px;background:#fef2f2;border-radius:8px;text-align:center">
          <i class="fa-solid fa-circle-exclamation"></i> Usuario o contraseña incorrectos
        </div>
        <button type="submit" class="btn btn-primary btn-login">
          <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
        </button>
      </form>
    </div>

    <div class="login-footer">
      ¿Problemas? <a href="contacto.html">Contáctanos</a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Si ya hay sesión activa, redirigir
    const sesion = JSON.parse(sessionStorage.getItem('sesion360') || 'null');
    if (sesion) {
      window.location.href = sesion.rol === 'medico' ? 'index.html' : 'paciente-vista.html';
    }

    let rolActual = 'medico';

    function setRol(rol) {
      rolActual = rol;
      document.getElementById('tabMedico').classList.toggle('active', rol === 'medico');
      document.getElementById('tabPaciente').classList.toggle('active', rol === 'paciente');
      document.getElementById('loginError').style.display = 'none';

      if (rol === 'medico') {
        document.getElementById('loginTitle').innerHTML = '<i class="fa-solid fa-stethoscope"></i> Acceso Médico';
        document.getElementById('demoHint').innerHTML = '<strong>Credenciales de demo:</strong> Usuario: <code>doctor</code> &nbsp; Contraseña: <code>1234</code>';
        document.getElementById('loginUser').placeholder = 'Ingresa tu usuario';
      } else {
        document.getElementById('loginTitle').innerHTML = '<i class="fa-solid fa-user-injured"></i> Acceso Paciente';
        document.getElementById('demoHint').innerHTML = '<strong>Credenciales de demo:</strong> Celular registrado como usuario &nbsp; Contraseña: <code>1234</code><br><small style="color:var(--text-sub)">Ej: <code>987654321</code> para María García López</small>';
        document.getElementById('loginUser').placeholder = 'Ingresa tu DNI';
      }
    }

    function togglePass() {
      const inp = document.getElementById('loginPass');
      const ico = document.getElementById('eyeIcon');
      if (inp.type === 'password') { inp.type = 'text'; ico.className = 'fa-solid fa-eye-slash'; }
      else { inp.type = 'password'; ico.className = 'fa-solid fa-eye'; }
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';

      if (rolActual === 'medico') {
        // Credenciales médico fijas
        if (user === 'doctor' && pass === '1234') {
          sessionStorage.setItem('sesion360', JSON.stringify({ rol: 'medico', nombre: 'Dr. Ramírez', especialidad: 'Cardiología' }));
          window.location.href = 'index.html';
        } else {
          errEl.style.display = 'block';
        }
      } else {
        // Buscar paciente por celular (usado como DNI/ID)
        const pacs = JSON.parse(localStorage.getItem('pacientes360') || '[]');
        const pac = pacs.find(p => p.celular === user || p.id == user);
        if (pac && pass === '1234') {
          sessionStorage.setItem('sesion360', JSON.stringify({ rol: 'paciente', id: pac.id, nombre: pac.nombre }));
          window.location.href = 'paciente-vista.html';
        } else {
          errEl.style.display = 'block';
        }
      }
    }
  </script>
</body>
</html>
