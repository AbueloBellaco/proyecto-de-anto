<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes | ADHERENCIA 360</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="layout-app">

  <aside class="sidebar">
  <div class="sidebar-header">
    <i class="fa-solid fa-shield-heart logo-icon"></i>
    <h2>ADHERENCIA <span>360</span></h2>
  </div>
  <nav class="sidebar-nav">
    <a href="index.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
    <a href="pacientes.html" class="active"><i class="fa-solid fa-users"></i> Pacientes</a>
    <a href="medicamentos.html"><i class="fa-solid fa-capsules"></i> Tratamientos</a>
    <a href="contacto.html"><i class="fa-solid fa-location-dot"></i> Contáctenos</a>
  </nav>
  <div class="sidebar-footer">
    <button id="darkToggle" class="btn-icon">
      <i class="fa-solid fa-moon"></i>
      <span class="dark-label">Modo Oscuro</span>
    </button>
    <button class="btn-icon" onclick="cerrarSesion()" style="color:var(--red);margin-top:8px">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Cerrar Sesión</span>
    </button>
  </div>
</aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <h1>Directorio de Pacientes</h1>
        <p>Gestiona la información y el estado de tus pacientes.</p>
      </div>
      <button class="btn btn-primary" onclick="abrirModal('modalPaciente')">
        <i class="fa-solid fa-plus"></i> Nuevo Paciente
      </button>
    </header>

    <div class="content-wrapper">
      <div class="card">
        <div class="card-header flex-between">
          <div class="search-box">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="buscarPaciente" placeholder="Buscar por nombre, enfermedad..."
              oninput="filtrarTabla('buscarPaciente', 'tablaPacientes')">
          </div>
          <span id="contadorPacientes" class="section-pill"></span>
        </div>
        <div class="card-body">
          <table class="data-table" id="tablaPacientes">
            <thead>
              <tr>
                <th>Nombre Completo</th>
                <th>Enfermedad Base</th>
                <th>Celular (WhatsApp)</th>
                <th>Estado</th>
                <th>Adherencia</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="listaPacientesBody">
              <tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-sub)">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- MODAL NUEVO PACIENTE -->
  <div class="modal-overlay" id="modalPaciente">
    <div class="modal-box">
      <div class="modal-header">
        <h2><i class="fa-solid fa-user-plus" style="color:var(--primary);margin-right:8px"></i>Registrar Nuevo Paciente</h2>
        <button class="close-btn" onclick="cerrarModal('modalPaciente')">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="formPaciente" class="modal-body">
        <div class="form-group">
          <label>Nombre Completo *</label>
          <input type="text" id="pacNombre" required placeholder="Ej. Juan Pérez García">
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>Enfermedad Base *</label>
            <select id="pacEnfermedad" required>
              <option value="">Seleccione...</option>
              <option value="Diabetes T2">Diabetes Tipo 2</option>
              <option value="Hipertensión">Hipertensión</option>
              <option value="Asma">Asma</option>
              <option value="Cardiopatía">Cardiopatía</option>
              <option value="EPOC">EPOC</option>
              <option value="Hipotiroidismo">Hipotiroidismo</option>
              <option value="Artritis reum.">Artritis Reumatoide</option>
              <option value="Otra">Otra</option>
            </select>
          </div>
          <div class="form-group">
            <label>N° Celular (WhatsApp) *</label>
            <input type="tel" id="pacCelular" required placeholder="9XX XXX XXX">
          </div>
        </div>
        <div class="form-group">
          <label>Adherencia inicial (%)</label>
          <input type="number" id="pacAdherencia" min="0" max="100" value="100" placeholder="100">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="cerrarModal('modalPaciente')">Cancelar</button>
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-save"></i> Guardar Paciente
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast">
    <i class="fa-solid fa-circle-check" style="margin-right:8px"></i>
    <span id="toastMsg"></span>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Actualizar contador
    (function() {
      const counter = document.getElementById('contadorPacientes');
      if (counter) {
        const pacs = JSON.parse(localStorage.getItem('pacientes360') || '[]');
        counter.textContent = pacs.length + ' pacientes';
      }
    })();
  </script>
</body>
</html>
